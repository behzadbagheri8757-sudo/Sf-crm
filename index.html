<script>
/* Apply the saved theme before first paint. The stored preference is one of:
   system | light | dark. The root data-theme attribute is always the resolved
   visual theme, so CSS never needs a competing theme architecture. */
(function(){
  try{
    var KEY = 'baqeri_theme_v1';
    var root = document.documentElement;
    var mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function normalize(v){
      return v === 'light' || v === 'dark' || v === 'system' ? v : 'system';
    }
    function resolve(v){
      v = normalize(v);
      return v === 'system' ? (mql && mql.matches ? 'dark' : 'light') : v;
    }
    function apply(v){
      root.setAttribute('data-theme', resolve(v));
    }
    function preference(){
      try { return normalize(localStorage.getItem(KEY)); } catch(e) { return 'system'; }
    }

    apply(preference());

    window.BaqeriTheme = {
      key: KEY,
      getPreference: preference,
      apply: apply,
      setPreference: function(v){
        v = normalize(v);
        try { localStorage.setItem(KEY, v); } catch(e) {}
        apply(v);
        return v;
      }
    };

    if(mql){
      var onSystemChange = function(){
        if(preference() === 'system') apply('system');
      };
      if(typeof mql.addEventListener === 'function') mql.addEventListener('change', onSystemChange);
      else if(typeof mql.addListener === 'function') mql.addListener(onSystemChange);
    }
  }catch(e){}
})();
</script>
